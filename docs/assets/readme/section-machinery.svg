    <circle class="e" cx="376" cy="142" r="1.4" style="--dx:0px;animation-duration:5.7s;animation-delay:-4.8s"/>
    <circle class="e" cx="1055" cy="149" r="2.8" style="--dx:-16px;animation-duration:8.7s;animation-delay:-1.0s"/>
    <circle class="e" cx="470" cy="131" r="2.2" style="--dx:-23px;animation-duration:5.6s;animation-delay:-9.0s"/>
    <circle class="e" cx="968" cy="140" r="1.4" style="--dx:-24px;animation-duration:7.5s;animation-delay:-8.9s"/>
    <circle class="e" cx="745" cy="141" r="2.8" style="--dx:-5px;animation-duration:5.9s;animation-delay:-0.2s"/>
    <circle class="e" cx="987" cy="139" r="2.2" style="--dx:-17px;animation-duration:8.9s;animation-delay:-7.2s"/>
    <circle class="e" cx="1135" cy="122" r="2.2" style="--dx:-15px;animation-duration:8.1s;animation-delay:-0.2s"/>
    <circle class="e" cx="328" cy="146" r="1.4" style="--dx:9px;animation-duration:8.1s;animation-delay:-6.1s"/>
    <circle class="e" cx="667" cy="125" r="2.8" style="--dx:-8px;animation-duration:7.7s;animation-delay:-6.9s"/>
    <circle class="e" cx="951" cy="150" r="1.8" style="--dx:17px;animation-duration:5.7s;animation-delay:-3.3s"/>
