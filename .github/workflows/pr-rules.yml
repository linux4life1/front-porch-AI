name: PR rules

# CLAUDE.md "Definition of done", checked on every PR so it binds every
# author, not only the agents that read CLAUDE.md.
#
# 1. Hand-check lines. A PR that changes UI (lib/ui/, lib/main*.dart,
#    web_ui/src/ outside its tests) needs a `## Hand-check` section in its
#    description. Every list line in it names the test that does the check
#    (a `_test.dart`, `.spec.ts` or `.test.ts(x)` path that exists on the
#    PR's head) or starts `eye-only:` for what only a person can judge. The
#    smoke tester does the eye-only lines and looks at the changed screens.
# 2. Images. A PR may not add a picture outside the places pictures belong
#    (goldens, app assets, platform icons, docs/screenshots). #568 committed
#    screenshots of a real chat library; PR screenshots show seeded or
#    synthetic data only and live under docs/screenshots/. The
#    `approved-images` label lets a deliberate stray one in.
# 4. Screenshots. A PR that changes UI needs a `## Screenshots` section in
#    its DESCRIPTION (a comment does not count) holding at least one image,
#    and every image there must be real: a GitHub upload, or a file under
#    docs/screenshots/ present on the PR's head. CLAUDE.md "One UI": every
#    UI or UX change is shown, desktop and web. No label skips it and no
#    author is exempt, maintainer included.
# 5. Web parity. A PR that changes desktop UI (lib/ui/) or web UI
#    (web_ui/src/) but not both needs a `## Web parity` section saying why:
#    a line starting `none:` or `deferred:` with a reason. CLAUDE.md "One UI":
#    the surfaces ship together unless the maintainer deferred it.
# 3. Smoke tier. The job summary prints the tier the changed files call for
#    (docs/maintainer-agent-playbook.md, "Which PRs get a smoke run").
# 6. Attribution. The description ends with one line — `Generated with
#    <harness> (<model ID>)` — naming what drove the work and the exact
#    model it reported (CLAUDE.md "Git"). Un-replaced `<placeholders>` do
#    not count; a human may name their editor and skip the model; dependabot,
#    which cannot edit its own body, is exempt from this check only. #748
#    and #749 shipped without footers and this file said nothing, which is
#    what a rule without a check buys you.
#
# pull_request_target, like test-integrity.yml: the base branch's copy runs,
# so a PR cannot loosen the check that gates it, and the description edit
# that fixes a red re-runs it. SAFETY: this job never checks out or runs PR
# code. It only reads the description, the changed paths, and whether a
# named test file exists on the head. Keep it that way.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  rules:
    name: PR rules (hand-check, images, smoke tier)
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'release/promote-') }}
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map((l) => l.name);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const live = files.filter((f) => f.status !== 'removed');
            const paths = live.map((f) => f.filename);
            const errors = [];

            const isTest = (p) =>
              /_test\.dart$/.test(p) || /\.(test|spec)\.[cm]?[jt]sx?$/.test(p);
            const isUi = (p) =>
              (p.startsWith('lib/ui/') && p.endsWith('.dart')) ||
              /^lib\/main(\.[\w.]+)?\.dart$/.test(p) ||
              (p.startsWith('web_ui/src/') && !isTest(p));

            // --- Images ------------------------------------------------------
            const IMAGE = /\.(png|jpe?g|webp|gif|bmp|tiff?)$/i;
            const imageHome = (p) =>
              p.includes('/_goldens/') ||
              p.includes('/goldens/') ||
              p.startsWith('assets/') ||
              p.startsWith('docs/screenshots/') ||
              p.startsWith('docs/assets/images/') ||
              p.startsWith('web_ui/public/') ||
              /^(android|ios|linux|macos|windows|aur|aur-beta)\//.test(p);
            const strayImages = live
              .filter((f) => ['added', 'renamed', 'copied'].includes(f.status) && IMAGE.test(f.filename))
              .map((f) => f.filename)
              .filter((p) => !imageHome(p));
            if (strayImages.length && !labels.includes('approved-images')) {
              errors.push(
                'Adds pictures outside goldens, assets/ and docs/screenshots/:\n' +
                  strayImages.map((p) => `  - ${p}`).join('\n') +
                  '\nPut evidence screenshots in the PR thread, not the repo. ' +
                  'A deliberate one needs the `approved-images` label.',
              );
            }

            // --- Hand-check --------------------------------------------------
            const uiFiles = paths.filter(isUi);
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const section = body.match(/^##\s+Hand-check\s*$([\s\S]*?)(?=^##\s|(?![\s\S]))/im);
            const lines = section
              ? section[1]
                  .split('\n')
                  .map((l) => l.trim())
                  .filter((l) => /^([-*+]|\d+[.)])\s+/.test(l))
                  .map((l) => l.replace(/^([-*+]|\d+[.)])\s+(\[[ xX]\]\s+)?/, ''))
              : [];
            const TEST_PATH = /(?:integration_test|test|web_ui)\/[\w./-]+?(?:_test\.dart|\.(?:test|spec)\.[cm]?[jt]sx?)/g;
            const eyeOnly = lines.filter((l) => /^`?eye-only:/i.test(l));
            const missingTests = [];
            const untested = [];
            for (const line of lines) {
              if (/^`?eye-only:/i.test(line)) continue;
              const named = line.match(TEST_PATH) || [];
              if (!named.length) {
                untested.push(line);
                continue;
              }
              for (const p of named) {
                if (paths.includes(p)) continue;
                try {
                  await github.rest.repos.getContent({
                    ...context.repo,
                    path: p,
                    ref: pr.head.sha,
                  });
                } catch (e) {
                  if (e.status !== 404) throw e;
                  missingTests.push(p);
                }
              }
            }
            if (uiFiles.length) {
              if (!section || !lines.length) {
                errors.push(
                  'Changes UI but the description has no `## Hand-check` list. ' +
                    'Add one line per thing a person would check: the test ' +
                    'that does it, or `eye-only: <what to look at>`.',
                );
              }
            }
            if (untested.length) {
              errors.push(
                'Hand-check lines that name no test and are not `eye-only:`:\n' +
                  untested.map((l) => `  - ${l}`).join('\n'),
              );
            }
            if (missingTests.length) {
              errors.push(
                'Hand-check lines name tests that are not on this branch:\n' +
                  missingTests.map((p) => `  - ${p}`).join('\n'),
              );
            }

            // --- Screenshots (One UI; no label, no author, no exception) ------
            // In the description itself, never a comment. Every image must be
            // real: a GitHub upload, or a file under docs/screenshots/ that
            // exists on this PR's head. A link to anywhere else, or to a file
            // that is not there, does not count and fails the check.
            if (uiFiles.length) {
              const shots = body.match(/^##\s+Screenshots\s*$([\s\S]*?)(?=^##\s|(?![\s\S]))/im);
              const text = shots ? shots[1] : '';
              const refs = new Set();
              for (const m of text.matchAll(/!\[[^\]]*\]\(\s*<?([^)\s>]+)/g)) refs.add(m[1]);
              for (const m of text.matchAll(/<img\s[^>]*?\bsrc\s*=\s*["']([^"']+)["']/gi)) refs.add(m[1]);
              for (const m of text.matchAll(/https:\/\/github\.com\/user-attachments\/assets\/[\w-]+/gi)) refs.add(m[0]);
              const UPLOAD = /^https:\/\/(?:github\.com\/user-attachments\/assets\/|private-user-images\.githubusercontent\.com\/|user-images\.githubusercontent\.com\/)/i;
              const IMG_EXT = /\.(png|jpe?g|webp|gif)$/i;
              const repos = new Set(
                [pr.base.repo.full_name, pr.head.repo && pr.head.repo.full_name]
                  .filter(Boolean)
                  .map((r) => r.toLowerCase()),
              );
              // The ref between the repo and docs/screenshots/ may itself
              // contain slashes: this repo's branches are `feat/...`, and the
              // body guidance asks for branch-pinned raw URLs.
              const repoPath = (u) => {
                let m = u.match(/^https:\/\/github\.com\/([^/]+\/[^/]+)\/(?:blob|raw)\/.+?\/(docs\/screenshots\/[^?#]+)/i);
                if (!m) m = u.match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+\/[^/]+)\/.+?\/(docs\/screenshots\/[^?#]+)/i);
                if (m) return repos.has(m[1].toLowerCase()) ? decodeURIComponent(m[2]) : null;
                m = u.match(/^\.?\/?(docs\/screenshots\/[^?#]+)$/i);
                return m ? decodeURIComponent(m[1]) : null;
              };
              const good = [];
              const bad = [];
              for (const u of refs) {
                if (UPLOAD.test(u)) {
                  good.push(u);
                  continue;
                }
                const path = repoPath(u);
                if (!path || !IMG_EXT.test(path)) {
                  bad.push(`${u} (not a GitHub upload or a docs/screenshots/ image in this repo)`);
                  continue;
                }
                let found = paths.includes(path);
                if (!found) {
                  try {
                    await github.rest.repos.getContent({ ...context.repo, path, ref: pr.head.sha });
                    found = true;
                  } catch (e) {
                    if (e.status !== 404) throw e;
                  }
                }
                (found ? good : bad).push(found ? u : `${u} (not on this PR's head)`);
              }
              if (!good.length || bad.length) {
                errors.push(
                  (!shots
                    ? 'Changes UI but the description has no `## Screenshots` section.'
                    : !good.length
                      ? 'Changes UI but `## Screenshots` holds no real image.'
                      : 'Some screenshots are not real images on GitHub:') +
                    (bad.length ? '\n' + bad.map((l) => `  - ${l}`).join('\n') : '') +
                    '\nEvery UI or UX change shows each changed screen, desktop and ' +
                    'web, in the PR description itself (not a comment) (CLAUDE.md ' +
                    '"One UI"). Drag images into the `## Screenshots` section while ' +
                    'editing the description, or commit them under ' +
                    '`docs/screenshots/<topic>/` and embed them. Seeded or made-up ' +
                    'data only. No label or author is exempt.',
                );
              }
            }

            // --- Web parity (One UI) -----------------------------------------
            // Desktop UI and web UI ship together. When a PR changes only one
            // side, the description says why in a `## Web parity` section: a
            // line starting `none:` (the other side has nothing to change) or
            // `deferred:` (the maintainer deferred it in conversation), then
            // the reason. When both sides changed there is nothing to ask.
            const desktopUi = paths.filter(
              (p) => p.startsWith('lib/ui/') && p.endsWith('.dart') && !isTest(p),
            );
            const webUi = paths.filter(
              (p) => p.startsWith('web_ui/src/') && !isTest(p),
            );
            if ((desktopUi.length > 0) !== (webUi.length > 0)) {
              const side = desktopUi.length ? 'desktop (lib/ui/)' : 'web (web_ui/src/)';
              const other = desktopUi.length ? 'web (web_ui/src/)' : 'desktop (lib/ui/)';
              const par = body.match(/^##\s+Web parity\s*$([\s\S]*?)(?=^##\s|(?![\s\S]))/im);
              const ruling = par
                ? par[1]
                    .split('\n')
                    .map((l) => l.trim().replace(/^([-*+]\s+)?(\[[ xX]\]\s+)?/, ''))
                    .find((l) => /^(none|deferred):\s*.{12,}/i.test(l))
                : undefined;
              if (!ruling) {
                errors.push(
                  `Changes ${side} UI but nothing under ${other}. One UI: both ship ` +
                    'together. Either change the other side in this PR, or add a ' +
                    '`## Web parity` section to the description with one line: ' +
                    '`none: <why the other side has nothing to change>` or ' +
                    '`deferred: <what the maintainer deferred, and where it is tracked>`.',
                );
              }
            }

            // --- Attribution -----------------------------------------------
            // Comments are already out of `body`, so a template left half-
            // edited still shows its example — but that example is now a
            // `<placeholder>`, and a body that never replaced it attributes
            // the work to a model that never ran (Error Book, 2026-11-16:
            // exercise the gate on what your own docs emit — including the
            // template `gh pr create` prefills). Dependabot cannot edit its
            // own body, and its weekly bumps end in `</details>` boilerplate;
            // exempt the bot from this check only, not the gates around it.
            const bodyLines = body
              .split('\n')
              .map((l) => l.trim())
              .filter(Boolean);
            const lastBodyLine = bodyLines[bodyLines.length - 1] || '';
            const isDependabot = pr.user?.login === 'dependabot[bot]';
            if (
              !isDependabot &&
              (!/^Generated with\s+\S/.test(lastBodyLine) ||
                /<(harness|model)/i.test(lastBodyLine))
            ) {
              errors.push(
                'No attribution footer. CLAUDE.md "Git": the body ends with ' +
                  'one line in this shape:\n' +
                  '  Generated with <harness> (<model ID>)\n' +
                  'naming the harness that drove the work and the exact model ' +
                  'ID it reported this session — replace the placeholders, ' +
                  'they do not count as an answer (a human may name their ' +
                  'editor and skip the model). An agent PR that hides its ' +
                  'model ships the change and vanishes before the blame.',
              );
            }

            // --- Smoke tier --------------------------------------------------
            const RISKY = [
              /^lib\/database\//,
              /^(windows|linux|macos)\//,
              /(^|\/)[^/]*(picker|file_dialog|import|export)[^/]*$/i,
            ];
            const newScreens = live.filter(
              (f) =>
                f.status === 'added' &&
                /^(lib\/ui\/pages\/|web_ui\/src\/pages\/)/.test(f.filename) &&
                !isTest(f.filename),
            );
            const risky = paths.filter((p) => !isTest(p) && RISKY.some((r) => r.test(p)));
            let tier;
            let why;
            if (!uiFiles.length) {
              tier = 0;
              why = 'no UI file changed';
            } else if (risky.length || newScreens.length) {
              tier = 2;
              why = [
                risky.length && `risky paths: ${risky.slice(0, 5).join(', ')}`,
                newScreens.length && `new screen(s): ${newScreens.map((f) => f.filename).join(', ')}`,
              ]
                .filter(Boolean)
                .join('; ');
            } else {
              tier = 1;
              why = 'UI changed, no risky paths or new screens';
            }
            if (tier && eyeOnly.length) why += `; ${eyeOnly.length} eye-only line(s) to do by hand`;
            const tierName = ['none', 'look only', 'full'][tier];
            await core.summary
              .addHeading(`Smoke tier ${tier}: ${tierName}`, 3)
              .addRaw(`${why}.`)
              .addEOL()
              .write();
            core.notice(`Smoke tier ${tier} (${tierName}): ${why}.`);

            if (errors.length) core.setFailed(errors.join('\n\n'));
