name: CI

on:
  push:
    branches: [dev, main, Rawhide]
  pull_request:
    branches: [dev, main, Rawhide]
  schedule:
    # Run full project lint every Monday at 09:00 UTC
    - cron: '0 9 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: CI (changed Dart files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed for git diff against base branch

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze on changed Dart files only
        run: |
          # Get list of changed Dart files, compared against the *current state of the
          # target branch itself* (Rawhide for Rawhide work, dev for dev work, etc.).
          #
          # The old logic had a hard-coded `|| 'dev'` fallback that made the entire
          # "changed files only" gate garbage for Rawhide (the primary development
          # branch). Rawhide pushes must diff against origin/Rawhide, not dev.
          #
          # - pull_request: github.base_ref is the target (e.g. Rawhide)
          # - push: github.ref_name is the branch being pushed to (e.g. Rawhide)
          BASE_BRANCH="${{ github.base_ref || github.ref_name || 'Rawhide' }}"
          CHANGED_DART=$(git diff --name-only --diff-filter=ACM "origin/$BASE_BRANCH...HEAD" -- '*.dart' || true)

          if [ -z "$CHANGED_DART" ]; then
            echo "No Dart files changed in this run — skipping analyze."
            exit 0
          fi

          echo "Dart files changed (relative to origin/$BASE_BRANCH):"
          echo "$CHANGED_DART"
          echo ""

          # Now that the codebase is clean (0 warnings), we can be stricter on new code.
          # New warnings introduced in a PR/push will now fail the job.
          flutter analyze --no-fatal-infos $CHANGED_DART

  full-lint:
    name: Full project lint (scheduled + main pushes)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Rawhide' || github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run full Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        # Use --concurrency=1 because several tests (notably the "real production"
        # ChatService + GroupTurnManager + per-speaker realism evals + DB settles
        # in chat_service_realism_engine_test.dart) are integration-style and
        # timing-sensitive. Default high concurrency on GitHub runners causes
        # intermittent races in async group member population, isEvaluatingRealism
        # polling, and shared mock setup (path_provider, SharedPreferences,
        # forTesting DBs) even with the internal while-loop settles.
        # See test file comments on "robust settle", "under load/CI", and the
        # card-seed / inter-char key handling.
        # Pixel golden tests run in the dedicated `golden` job below so a render
        # diff never masks a logic failure here and vice-versa.
        run: flutter test --concurrency=1 --reporter expanded --exclude-tags golden
        timeout-minutes: 20

  web-tests:
    name: WebUI tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web_ui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci
        working-directory: web_ui

      # Typecheck (tsc) + pure unit tests (vitest). The tests use synthetic
      # fixtures only — no characters/chats, no running app, no network — so they
      # reproduce in any clean checkout, including contributor PRs to Rawhide.
      - name: Typecheck + unit tests
        run: |
          npm run lint
          npm test
        working-directory: web_ui

  theme-lint:
    name: Theme lint (no new raw blueAccent)
    # Skip on Rawhide→main promotion PRs: their diff is the ENTIRE Rawhide
    # branch, so every line grandfathered as diff context on normal PRs
    # re-appears as "added" (even comments that merely mention the banned
    # token) and the gate re-litigates history it already passed
    # incrementally. Same guard on io-lint below.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/promote-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed for git diff against base branch

      - name: Reject newly-added raw Colors.blueAccent
        run: |
          # The app has a single warm-porch palette. Raw `Colors.blueAccent`
          # chrome was fully retired in favour of AppColors.formMasterAccent /
          # AppColors.porchAmberOf(context). This gate keeps it retired: it only
          # inspects lines *added* in this PR/push (existing deliberate semantic
          # uses — trust chips, call-status colors, lorebook state badges — are
          # grandfathered as diff context and never re-scanned).
          #
          # Base-branch resolution mirrors the analyze job:
          #   - pull_request: github.base_ref is the target (e.g. Rawhide)
          #   - push:         github.ref_name is the branch pushed to
          BASE_BRANCH="${{ github.base_ref || github.ref_name || 'Rawhide' }}"

          ADDED=$(git diff --diff-filter=ACM "origin/$BASE_BRANCH...HEAD" -- 'lib/**/*.dart' \
            | grep -E '^\+' | grep -vE '^\+\+\+' \
            | grep 'Colors\.blueAccent' \
            | grep -v 'theme-keep' || true)

          if [ -n "$ADDED" ]; then
            echo "::error::New raw Colors.blueAccent introduced — the app uses the warm-porch palette."
            echo ""
            echo "Use AppColors.formMasterAccent (const) or AppColors.porchAmberOf(context) instead."
            echo "If this is a DELIBERATE semantic color (e.g. a status/indicator hue, not chrome),"
            echo "append a trailing '// theme-keep: <reason>' comment on the same line to allow it."
            echo ""
            echo "Offending added line(s):"
            echo "$ADDED"
            exit 1
          fi
          echo "No new raw Colors.blueAccent introduced. ✔"

  io-lint:
    name: IO lint (no new sync I/O in UI code)
    # Promotion-PR skip — see the theme-lint comment above.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/promote-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed for git diff against base branch

      - name: Reject newly-added synchronous I/O under lib/ui
        run: |
          # Synchronous I/O in widget build paths multiplies by widget count
          # x rebuild rate (per streaming token batch) and is invisible on
          # dev Macs but 10-100x more expensive on Windows under Defender's
          # file-stat interception. Canonical incident: coverImageFileFor's
          # existsSync ran per message bubble per rebuild and shipped as the
          # 20260716-nightly "app is sluggish" regression. This gate bans
          # NEW sync I/O anywhere under lib/ui (build paths can't be told
          # apart by grep, and UI-layer I/O belongs in services/caches
          # anyway). Existing sites are grandfathered as diff context.
          #
          # Base-branch resolution mirrors the theme-lint job.
          BASE_BRANCH="${{ github.base_ref || github.ref_name || 'Rawhide' }}"

          PATTERN='\.(existsSync|readAsStringSync|readAsBytesSync|readAsLinesSync|lengthSync|statSync|listSync|writeAsStringSync|writeAsBytesSync|createSync|deleteSync|copySync|renameSync)\(|Process\.runSync\('
          ADDED=$(git diff --diff-filter=ACM "origin/$BASE_BRANCH...HEAD" -- 'lib/ui/**/*.dart' \
            | grep -E '^\+' | grep -vE '^\+\+\+' \
            | grep -E "$PATTERN" \
            | grep -v 'io-ok' || true)

          if [ -n "$ADDED" ]; then
            echo "::error::New synchronous I/O added under lib/ui — this jank ships to users."
            echo ""
            echo "Resolve the value once in a service and cache/memoize it (invalidate on the"
            echo "events that change the answer), or use the async API off the build path."
            echo "If this line genuinely cannot run in a build/frame path (e.g. a one-shot"
            echo "dialog action handler), append '// io-ok: <reason>' on the same line."
            echo ""
            echo "Offending added line(s):"
            echo "$ADDED"
            exit 1
          fi
          echo "No new synchronous I/O under lib/ui. ✔"


  golden:
    name: Widget Golden Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Widget Golden Tests
        # Pixel goldens are authored against this ubuntu image and must match
        # exactly. Any UI change that shifts a pixel will fail this job.
        # To update goldens after an intentional UI change, run on Linux:
        #   flutter test --tags golden --update-goldens
        # then commit the refreshed PNGs alongside the UI change.
        #
        # This job runs in parallel with `test` (both need `analyze` to pass)
        # so a golden failure is always reported independently of logic failures.
        run: flutter test --concurrency=1 --reporter expanded --tags golden
        timeout-minutes: 10
