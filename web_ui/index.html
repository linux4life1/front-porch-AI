<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- iOS ignores SVG/manifest icons for "Add to Home Screen"; it needs a PNG
         apple-touch-icon declared here. -->
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f1913" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Front Porch" />
    <!-- "default", never "black-translucent": translucent lets the page draw
         under the iOS status bar, so every top-edge button must dodge the notch
         on every iPhone model. With "default" iOS starts the page below the
         bar on every device. The other edges (home bar, landscape notch) are
         handled once, in src/styles/safe-area.css. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Front Porch AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
