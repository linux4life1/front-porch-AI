name: CI

# Push to Rawhide/main still runs the cheap gates (analyze, full-lint,
# theme-lint, io-lint, web-tests) plus the unit/integration `test` suite
# (four file shards behind one `test` check). Widget goldens and the live
# Stoop pin already ran on the PR that landed the commit, so they skip when
# github.event_name == 'push' (`if: github.event_name != 'push'`, ANDed with
# any existing job `if:`). Re-queueing them on squash-merge starves open PRs.
#
# e2e-smoke splits by OS instead (maintainer decision, 2026-10-12): a PR runs
# the 5 Linux shards, a push to Rawhide/main runs the 10 macOS and Windows
# shards, and the schedule runs all 15. The macOS queue was most of a PR's
# wall time. The cost: a macOS- or Windows-only break shows up on Rawhide
# right after merge, not on the PR.
#
# Leaving draft reuses what already passed (2026-10-26). Marking a PR ready
# for review starts a new run on the same head commit. `changes` asks GitHub
# which jobs of this workflow already succeeded on that commit for this PR
# (output `passed`), and the cheap gates in that list do not run again:
# analyze, the four test shards, web-tests, theme-lint and io-lint. A job
# that failed, was cancelled or never ran on that commit runs as usual, and
# the heavy jobs start exactly as before. Every other event (a push to the
# PR, opened, reopened, a branch push, the schedule) reuses nothing. The
# cheap gates now `need` changes, which costs its few seconds before they
# start. A skipped job satisfies a required check, and the success it
# stands in for is already recorded on the PR's commit, so no required check
# goes missing. Two details: the test shards are skipped all
# four or none (a job-level `if:` cannot see `matrix`), and analyze skips its
# steps instead of the job, because test-shard and the heavy jobs `need` it
# and a skipped need would skip them too. If the lookup fails, `passed` is
# empty and everything runs.
# Trade-offs: a gate that went green by luck (a flake) on the draft run is
# not re-checked when the PR leaves draft; and a `pull_request` run tests the
# PR merged onto its base as the base was then, so if the base moved in
# between, the reused result is for that older merge. Push a commit, or close
# and reopen the PR, to run every gate again.

on:
  push:
    branches: [main, Rawhide]
  pull_request:
    branches: [main, Rawhide]
    # ready_for_review starts the heavy jobs a draft skipped and reuses the
    # cheap gates that already passed on the same commit (see `changes`).
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Run full project lint every Monday at 09:00 UTC
    - cron: '0 9 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A new push to a PR cancels that PR's older run: nobody reads a superseded
# result, and on 2026-10-12 superseded runs held most of the shared runners
# while the live ones queued. Pushes to Rawhide/main and the schedule get a
# group of their own run id, so they never cancel or replace one another and
# every landed commit keeps its full record. (A shared group would still drop
# a pending run when a third arrived, even without cancel-in-progress.)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # Whether this run needs the heavy jobs (stoop-live, e2e-smoke, web-e2e,
  # golden). A draft PR runs only the cheap gates; leaving draft starts the
  # rest, so the merge queue decides who gets the runners by taking PRs out
  # of draft in order (maintainer decision, 2026-10-19). A PR that only
  # changes Markdown or docs/ never needs them. Pushes and the schedule
  # always do. When a PR leaves draft, `passed` also lists the jobs that
  # already succeeded on its head commit, so the cheap gates skip a second
  # run (see the file header).
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    # Reads the PR's files and this workflow's earlier runs, nothing else.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.pick.outputs.heavy }}
      # JSON array of job names. Always valid JSON, so `fromJSON` downstream
      # cannot fail; an empty array means every job runs.
      passed: ${{ steps.reuse.outputs.passed || '[]' }}
    steps:
      - id: pick
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setOutput('heavy', 'true');
              return;
            }
            if (pr.draft) {
              core.notice('Draft PR: E2E, Playwright, goldens and the Stoop pin start when it leaves draft. The checks that pass now are not run again then.');
              core.setOutput('heavy', 'false');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const docsish = (n) => n.endsWith('.md') || n.startsWith('docs/');
            const docsOnly = files.every(
              (f) => docsish(f.filename) && (!f.previous_filename || docsish(f.previous_filename)),
            );
            if (docsOnly) core.notice('Docs-only PR: heavy jobs skipped.');
            core.setOutput('heavy', docsOnly ? 'false' : 'true');
      # Only when a PR leaves draft: the names of this workflow's jobs whose
      # latest attempt succeeded on this exact head commit, for this PR, in
      # an earlier run. The current run is excluded.
      - id: reuse
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const passed = new Set();
            try {
              const { data: self } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: context.runId,
              });
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo,
                workflow_id: self.workflow_id,
                event: 'pull_request',
                head_sha: pr.head.sha,
                per_page: 100,
              });
              for (const run of runs) {
                if (run.id === context.runId || run.head_sha !== pr.head.sha) continue;
                // This PR only: the lint gates diff against its base branch.
                // A fork's run lists no PRs, so its head repo and branch stand in.
                const prs = run.pull_requests || [];
                const samePr = prs.length
                  ? prs.some((p) => p.number === pr.number)
                  : run.head_branch === pr.head.ref &&
                    run.head_repository?.full_name === pr.head.repo.full_name;
                if (!samePr) continue;
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...context.repo,
                  run_id: run.id,
                  filter: 'latest',
                  per_page: 100,
                });
                for (const job of jobs) {
                  if (job.conclusion === 'success') passed.add(job.name);
                }
              }
            } catch (err) {
              core.warning(`Could not read earlier runs, so every job runs: ${err.message}`);
              passed.clear();
            }
            const names = [...passed].sort();
            if (names.length) {
              core.notice(`Passed earlier on ${pr.head.sha.slice(0, 7)}; the cheap gates among these are not run again: ${names.join(', ')}`);
            }
            core.setOutput('passed', JSON.stringify(names));

  analyze:
    name: CI (changed Dart files)
    runs-on: ubuntu-latest
    needs: changes
    # Runs even if `changes` failed (then `passed` is empty). When it already
    # passed on this commit it skips its steps, not the job, and reports
    # success: test-shard and the heavy jobs `need` it, and a skipped need
    # would skip them. Every step below carries the REUSED guard.
    if: ${{ !cancelled() }}
    env:
      REUSED: ${{ contains(fromJSON(needs.changes.outputs.passed || '[]'), 'CI (changed Dart files)') }}
    steps:
      - name: Already passed on this commit
        if: env.REUSED == 'true'
        run: echo "::notice::Passed on this commit before the PR left draft; not run again."

      - name: Checkout Code
        if: env.REUSED != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # needed for git diff against base branch

      - name: Setup Flutter
        if: env.REUSED != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: env.REUSED != 'true'
        run: flutter pub get

      - name: Run Flutter Analyze on changed Dart files only
        if: env.REUSED != 'true'
        run: |
          # Get list of changed Dart files, compared against the *current state of the
          # target branch itself* (Rawhide for Rawhide work, and so on).
          #
          # Rawhide pushes must diff against origin/Rawhide.
          #
          # - pull_request: github.base_ref is the target (e.g. Rawhide)
          # - push: github.ref_name is the branch being pushed to (e.g. Rawhide)
          BASE_BRANCH="${{ github.base_ref || github.ref_name || 'Rawhide' }}"
          CHANGED_DART=$(git diff --name-only --diff-filter=ACM "origin/$BASE_BRANCH...HEAD" -- '*.dart' || true)

          if [ -z "$CHANGED_DART" ]; then
            echo "No Dart files changed in this run — skipping analyze."
            exit 0
          fi

          echo "Dart files changed (relative to origin/$BASE_BRANCH):"
          echo "$CHANGED_DART"
          echo ""

          # Now that the codebase is clean (0 warnings), we can be stricter on new code.
          # New warnings introduced in a PR/push will now fail the job.
          flutter analyze --no-fatal-infos $CHANGED_DART

  full-lint:
    name: Full project lint (scheduled + main pushes)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Rawhide'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run full Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

  # Four runners, each taking every fourth test FILE. Each file is its own
  # compile and launch, and those costs, not the test bodies, were most of the
  # unsharded job's 21 minutes on 2026-10-12. `--total-shards` would not help:
  # it splits test CASES, so every shard would still load every file. Round-
  # robin over the sorted list (as e2e-smoke does) spreads each directory
  # across the shards. The union of the shards is exactly what one unsharded
  # run covers, so scripts/ci-local.sh keeps running the whole suite at once.
  test-shard:
    name: Tests (unit + integration) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: [analyze, changes]
    # Skipped when all four shards already passed on this commit (see the
    # file header). One shard missing from `passed` re-runs all four: a
    # job-level `if:` cannot see `matrix`. `!cancelled()` keeps the shards
    # running if `changes` failed; analyze must still have passed.
    if: >-
      ${{ !cancelled() && needs.analyze.result == 'success' &&
      !(contains(fromJSON(needs.changes.outputs.passed || '[]'), 'Tests (unit + integration) 1/4') &&
      contains(fromJSON(needs.changes.outputs.passed || '[]'), 'Tests (unit + integration) 2/4') &&
      contains(fromJSON(needs.changes.outputs.passed || '[]'), 'Tests (unit + integration) 3/4') &&
      contains(fromJSON(needs.changes.outputs.passed || '[]'), 'Tests (unit + integration) 4/4')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Setup Node (for the WebUI bundle)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web_ui/package-lock.json

      # The bundle is built, not tracked (it conflicted on every merge). The
      # server tests and the smoke suites serve it, so it is built here from
      # this commit, as the nightly and the release do.
      - name: Build WebUI bundle
        run: npm ci --ignore-scripts && npm run build
        working-directory: web_ui

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        # --concurrency=4 since 2026-08-07 (maintainer instruction). This was
        # pinned to 1, and the reason given was the "real production" ChatService
        # + GroupTurnManager + per-speaker realism eval tests in
        # chat_service_realism_engine_test.dart being integration-style and
        # timing-sensitive under load.
        #
        # THOSE TESTS NO LONGER EXIST. That file is now a 771-byte placeholder
        # and its own header records why: "The dynamic and group tests were
        # removed for 0 test fails (flaky timing/DB/prefs in full suite)."
        # The flaky tests were deleted; the pin protecting them was not. It has
        # been serialising all 2929 tests to guard code that is gone.
        #
        # Measured on a 4-core Linux box before changing: 578s at 1 vs 180s at 4
        # (3.2x), with 5 consecutive green unit runs and 3 green golden runs.
        #
        # IF FLAKES REAPPEAR: the fix is NOT to re-pin this to 1. Find the racy
        # FILE (shared mock setup — path_provider, SharedPreferences, forTesting
        # DBs — is the usual culprit) and fix or serialise that file. Slowing
        # every test in the repo to hide one racy one is what got us here.
        #
        # Pixel golden tests run in the dedicated `golden` job below so a render
        # diff never masks a logic failure here and vice-versa.
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARDS: 4
        run: |
          mapfile -t files < <(find test -name '*_test.dart' | LC_ALL=C sort |
            awk -v n="$TEST_SHARDS" -v k="$TEST_SHARD" '(NR - 1) % n == k - 1')
          echo "shard $TEST_SHARD/$TEST_SHARDS runs ${#files[@]} test file(s)"
          # A shard that matched nothing would report green having run nothing.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::shard $TEST_SHARD matched no test files"
            exit 1
          fi
          flutter test --concurrency=4 --reporter expanded --exclude-tags golden "${files[@]}"
        # Unsharded, the suite had reached 21 of a 30-minute limit
        # (2026-10-12). A shard creeping toward 15 needs a slow test found
        # and fixed, as the note above says, not another raise.
        timeout-minutes: 15

  # The check name the PR page and branch protection know. It passes only if
  # every shard passed, so a failed or skipped shard is a red check, not a
  # silent pass. A cancelled run (a newer push) skips it instead. The one
  # exception: shards skipped because every one of them already passed on
  # this commit (REUSED, see the file header) count as passed.
  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    needs: [test-shard, changes]
    if: ${{ !cancelled() }}
    steps:
      - name: All shards passed
        env:
          RESULT: ${{ needs.test-shard.result }}
          REUSED: >-
            ${{ contains(fromJSON(needs.changes.outputs.passed || '[]'), 'Tests (unit + integration) 1/4') &&
            contains(fromJSON(needs.changes.outputs.passed || '[]'), 'Tests (unit + integration) 2/4') &&
            contains(fromJSON(needs.changes.outputs.passed || '[]'), 'Tests (unit + integration) 3/4') &&
            contains(fromJSON(needs.changes.outputs.passed || '[]'), 'Tests (unit + integration) 4/4') }}
        run: |
          echo "shards: $RESULT (all passed earlier on this commit: $REUSED)"
          if [ "$RESULT" = skipped ] && [ "$REUSED" = true ]; then
            echo "::notice::All four shards passed on this commit before the PR left draft; not run again."
            exit 0
          fi
          [ "$RESULT" = success ]

  # Live Stoop pin (#264): talks HTTP to the real hub, not FakeStoopServer.
  # Secrets stay on this job's env only — never echo them. Fork PRs skip
  # the job (no secrets). Same-repo PRs run the pin and fail this job if
  # it fails. Branch pushes skip this job (the PR already ran it; see the
  # file-header note). The unit job above still skips the tagged suite
  # when those env vars are absent.
  stoop-live:
    name: Stoop live (NSFW refresh)
    runs-on: ubuntu-latest
    needs: [analyze, changes]
    if: >
      needs.changes.outputs.heavy == 'true' &&
      github.event_name != 'push' &&
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check live Stoop secrets
        id: creds
        env:
          STOOP_TEST_EMAIL: ${{ secrets.STOOP_TEST_EMAIL }}
          STOOP_TEST_PASSWORD: ${{ secrets.STOOP_TEST_PASSWORD }}
        run: |
          if [ -z "$STOOP_TEST_EMAIL" ] || [ -z "$STOOP_TEST_PASSWORD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Live Stoop secrets are not available in this run — skipping (not stubbing)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run live Stoop pin
        if: steps.creds.outputs.skip != 'true'
        env:
          STOOP_TEST_EMAIL: ${{ secrets.STOOP_TEST_EMAIL }}
          STOOP_TEST_PASSWORD: ${{ secrets.STOOP_TEST_PASSWORD }}
          STOOP_LIVE_URL: ${{ secrets.STOOP_LIVE_URL }}
        run: |
          if [ -z "${STOOP_LIVE_URL:-}" ]; then
            export STOOP_LIVE_URL="https://api.frontporchai.app"
          fi
          flutter test --tags stoop_live \
            test/ui/pages/repository/stoop_nsfw_refresh_test.dart

  # Full-array E2E smoke: boots the REAL desktop app (windowed, on the runner's
  # display session) through a sandboxed two-turn chat against an in-process
  # fake backend, asserting realism evals, needs sim, chaos pressure, objective
  # proposal + task-gen, and a real journal maintenance pass. See
  # integration_test/app_smoke_test.dart for the isolation contract.
  # Runner notes: no human mouse and no real KoboldCpp exist here, so the two
  # local-run hazards (hover-wedge, zombie-kill) don't apply.
  #
  # SHARDED (2026-08-05, maintainer request "make it faster"). The suites are
  # independent, so each OS fans out over E2E_SHARDS parallel jobs instead of
  # walking all of them in one. Round-robin (index % shards), not contiguous
  # blocks, because suite durations vary and blocks would leave one shard long.
  #
  # Why the shard count is modest: every shard re-pays the app build, which is
  # the fixed cost here. Measured on the 25-suite run 08f000f — macOS 25m01s,
  # Windows 23m27s, Linux 15m35s — that is roughly a 5 min build plus ~48s per
  # suite on macOS. Five shards puts macOS at build + 5 suites ~= 9 min rather
  # than 25. Going wider mostly buys more builds, not less wall clock.
  # Every platform joins this matrix the same way: experimental
  # (continue-on-error) until it has two consecutive green runs on record —
  # so a new platform's shakedown can never red a contributor's PR — then it
  # graduates to blocking. Windows and Linux both graduated on 2026-07-28,
  # each having passed from its very first execution.
  e2e-smoke:
    name: E2E smoke (${{ matrix.device }} ${{ matrix.shard }}/5)
    needs: [analyze, changes]
    if: needs.changes.outputs.heavy == 'true'
    # OS split by event — see the file-header note. No `include` mapping for
    # the runner: an include entry naming a device absent from this event's
    # list would ADD a shard-less job instead of matching nothing.
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(github.event_name == 'pull_request' && '["linux"]' || github.event_name == 'push' && '["macos","windows"]' || '["macos","windows","linux"]') }}
        shard: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.device == 'macos' && 'macos-latest' || matrix.device == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    env:
      E2E_SHARDS: 5
      E2E_SHARD: ${{ matrix.shard }}
    # 20 suites per OS, each failing suite retried once with a full rebuild.
    # Sizing history: 30 truncated a Linux round mid-list (hid four verdicts);
    # 45 then ran out on the first 20-suite round, because a FAILING suite is
    # far more expensive than a passing one — its waits burn their full
    # CI-scaled deadline (kCiTimeoutScale = 4) twice over, once per attempt.
    # 60 keeps a red round fully diagnostic instead of hiding the tail.
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      # Linux desktop build deps + a virtual display for the windowed test.
      # GStreamer is for audioplayers_linux; GTK for the shell itself;
      # libsecret is for flutter_secure_storage_linux.
      #
      # Note what is deliberately NOT here: any spell-check package. The
      # hunspell engine is compiled in from third_party/ and an en_US
      # dictionary ships in the bundle, so spell_check_test.dart must pass on a
      # machine with nothing installed. Adding one here would hide a broken
      # bundle behind the runner's own packages.
      - name: Install Linux desktop dependencies
        if: matrix.device == 'linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Node (for the WebUI bundle)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web_ui/package-lock.json

      # The bundle is built, not tracked (it conflicted on every merge). The
      # server tests and the smoke suites serve it, so it is built here from
      # this commit, as the nightly and the release do.
      - name: Build WebUI bundle
        run: npm ci --ignore-scripts && npm run build
        working-directory: web_ui

      - name: Install dependencies
        run: flutter pub get

      # Glob, not a hardcoded filename: naming app_smoke_test.dart meant a new
      # integration test was invisible to CI until someone remembered to add it
      # here, and a test nobody runs is not a safety net.
      #
      # One `flutter test` PER FILE, not `flutter test integration_test`.
      # Passing the directory runs them in a single invocation, which launches
      # a second copy of the app while the first still holds the desktop
      # device — the second file then dies at "loading" with no stack. Measured
      # 2026-08-01: app_smoke passed, group_smoke failed exactly that way.
      - name: Run E2E smoke suite
        if: matrix.device != 'linux'
        shell: bash
        run: |
          set -e
          i=0
          ran=0
          for f in integration_test/*_test.dart; do
            if [ $(( i % E2E_SHARDS )) -ne $(( E2E_SHARD - 1 )) ]; then
              i=$((i + 1)); continue
            fi
            i=$((i + 1)); ran=$((ran + 1))
            echo "::group::$f"
            flutter test "$f" -d ${{ matrix.device }}
            echo "::endgroup::"
          done
          # A shard that silently matched nothing would report green having
          # tested nothing at all — the exact failure mode the glob was
          # introduced to kill. Only legal once suites < shards.
          echo "shard $E2E_SHARD/$E2E_SHARDS ran $ran suite(s)"
          if [ "$ran" -eq 0 ]; then
            echo "::error::shard $E2E_SHARD matched no suites"
            exit 1
          fi

      # Linux under xvfb has been observed to drop the device mid-boot and
      # report "No tests were found" (exit 79) with no Dart stack — a true
      # process death, not an assertion fail. One automatic retry absorbs the
      # flake without masking a real regression (second failure still reds).
      - name: Run E2E smoke suite (under xvfb)
        if: matrix.device == 'linux'
        run: |
          set +e
          overall=0
          i=0
          ran=0
          for f in integration_test/*_test.dart; do
            if [ $(( i % E2E_SHARDS )) -ne $(( E2E_SHARD - 1 )) ]; then
              i=$((i + 1)); continue
            fi
            i=$((i + 1)); ran=$((ran + 1))
            status=0
            for attempt in 1 2; do
              echo "::group::$f (attempt $attempt)"
              xvfb-run -a -s "-screen 0 1600x1000x24" \
                flutter test "$f" -d linux
              status=$?
              echo "::endgroup::"
              if [ "$status" -eq 0 ]; then
                break
              fi
              echo "$f attempt $attempt failed (exit $status)"
              if [ "$attempt" -eq 1 ]; then
                echo "Retrying once..."
                # Clear any half-built bundle state from a crashed device process.
                rm -rf build/linux
              fi
            done
            if [ "$status" -ne 0 ]; then
              overall="$status"
            fi
          done
          echo "shard $E2E_SHARD/$E2E_SHARDS ran $ran suite(s)"
          if [ "$ran" -eq 0 ]; then
            echo "::error::shard $E2E_SHARD matched no suites"
            exit 1
          fi
          exit "$overall"

  web-tests:
    name: WebUI tests (vitest)
    runs-on: ubuntu-latest
    needs: changes
    # Skipped when it already passed on this commit (see the file header).
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.passed || '[]'), 'WebUI tests (vitest)') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web_ui/package-lock.json

      - name: Install WebUI dependencies
          # --ignore-scripts: no package in this tree runs an install-time
          # script today (verified 2026-08-05), so this changes nothing now
          # and blocks the ChainDrop vector if one ever arrives.
        run: npm ci --ignore-scripts
        working-directory: web_ui

      # Typecheck (tsc) + pure unit tests (vitest). The tests use synthetic
      # fixtures only — no characters/chats, no running app, no network — so they
      # reproduce in any clean checkout, including contributor PRs to Rawhide.
      - name: Typecheck + unit tests
        run: |
          npm run lint
          npm test
        working-directory: web_ui

  # The web UI in real browsers against the real app: boots the desktop app on
  # a sandboxed library (integration_test/web_ui/browser_test.dart), starts its
  # web server, and runs Playwright — WebKit at iPhone size, Chromium at
  # desktop size. The sweep pokes every screen; the journeys sign in, chat,
  # edit, regenerate, swipe, continue, delete, switch chats. Runs on pushes
  # too: most web work lands on Rawhide directly, where e2e-smoke never runs.
  web-e2e:
    name: WebUI in real browsers (Playwright)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web_ui/package-lock.json

      - name: Install Linux desktop dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install WebUI dependencies + browsers
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
        working-directory: web_ui

      # Serve the bundle built from this commit, not whatever was committed.
      - name: Build WebUI bundle
        run: npm run build
        working-directory: web_ui

      - name: Install dependencies
        run: flutter pub get

      - name: Run browser suite (under xvfb)
        env:
          FPAI_REPO_ROOT: ${{ github.workspace }}
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            flutter test integration_test/web_ui/browser_test.dart -d linux

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-report
          path: |
            web_ui/e2e/report
            web_ui/e2e/results
          retention-days: 14

  theme-lint:
    name: Theme lint (no new raw blueAccent)
    # Skip on Rawhide→main promotion PRs: their diff is the ENTIRE Rawhide
    # branch, so every line grandfathered as diff context on normal PRs
    # re-appears as "added" (even comments that merely mention the banned
    # token) and the gate re-litigates history it already passed
    # incrementally. Same guard on io-lint below. Also skipped when it
    # already passed on this commit (see the file header).
    needs: changes
    if: >-
      ${{ !cancelled() &&
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/promote-')) &&
      !contains(fromJSON(needs.changes.outputs.passed || '[]'), 'Theme lint (no new raw blueAccent)') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # needed for git diff against base branch

      - name: Reject newly-added raw Colors.blueAccent
        run: |
          # The app has a single warm-porch palette. Raw `Colors.blueAccent`
          # chrome was fully retired in favour of AppColors.formMasterAccent /
          # AppColors.porchAmberOf(context). This gate keeps it retired: it only
          # inspects lines *added* in this PR/push (existing deliberate semantic
          # uses — trust chips, call-status colors, lorebook state badges — are
          # grandfathered as diff context and never re-scanned).
          #
          # Base-branch resolution mirrors the analyze job:
          #   - pull_request: github.base_ref is the target (e.g. Rawhide)
          #   - push:         github.ref_name is the branch pushed to
          BASE_BRANCH="${{ github.base_ref || github.ref_name || 'Rawhide' }}"

          ADDED=$(git diff --diff-filter=ACM "origin/$BASE_BRANCH...HEAD" -- 'lib/**/*.dart' \
            | grep -E '^\+' | grep -vE '^\+\+\+' \
            | grep 'Colors\.blueAccent' \
            | grep -v 'theme-keep' || true)

          if [ -n "$ADDED" ]; then
            echo "::error::New raw Colors.blueAccent introduced — the app uses the warm-porch palette."
            echo ""
            echo "Use AppColors.formMasterAccent (const) or AppColors.porchAmberOf(context) instead."
            echo "If this is a DELIBERATE semantic color (e.g. a status/indicator hue, not chrome),"
            echo "append a trailing '// theme-keep: <reason>' comment on the same line to allow it."
            echo ""
            echo "Offending added line(s):"
            echo "$ADDED"
            exit 1
          fi
          echo "No new raw Colors.blueAccent introduced. ✔"

  io-lint:
    name: IO lint (no new sync I/O in UI code)
    # Promotion-PR skip and reuse skip — see the theme-lint comment above.
    needs: changes
    if: >-
      ${{ !cancelled() &&
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/promote-')) &&
      !contains(fromJSON(needs.changes.outputs.passed || '[]'), 'IO lint (no new sync I/O in UI code)') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # needed for git diff against base branch

      - name: Reject newly-added synchronous I/O under lib/ui
        run: |
          # Synchronous I/O in widget build paths multiplies by widget count
          # x rebuild rate (per streaming token batch) and is invisible on
          # dev Macs but 10-100x more expensive on Windows under Defender's
          # file-stat interception. Canonical incident: coverImageFileFor's
          # existsSync ran per message bubble per rebuild and shipped as the
          # 20260716-nightly "app is sluggish" regression. This gate bans
          # NEW sync I/O anywhere under lib/ui (build paths can't be told
          # apart by grep, and UI-layer I/O belongs in services/caches
          # anyway). Existing sites are grandfathered as diff context.
          #
          # Base-branch resolution mirrors the theme-lint job.
          BASE_BRANCH="${{ github.base_ref || github.ref_name || 'Rawhide' }}"

          PATTERN='\.(existsSync|readAsStringSync|readAsBytesSync|readAsLinesSync|lengthSync|statSync|listSync|writeAsStringSync|writeAsBytesSync|createSync|deleteSync|copySync|renameSync)\(|Process\.runSync\('
          ADDED=$(git diff --diff-filter=ACM "origin/$BASE_BRANCH...HEAD" -- 'lib/ui/**/*.dart' \
            | grep -E '^\+' | grep -vE '^\+\+\+' \
            | grep -E "$PATTERN" \
            | grep -v 'io-ok' || true)

          if [ -n "$ADDED" ]; then
            echo "::error::New synchronous I/O added under lib/ui — this jank ships to users."
            echo ""
            echo "Resolve the value once in a service and cache/memoize it (invalidate on the"
            echo "events that change the answer), or use the async API off the build path."
            echo "If this line genuinely cannot run in a build/frame path (e.g. a one-shot"
            echo "dialog action handler), append '// io-ok: <reason>' on the same line."
            echo ""
            echo "Offending added line(s):"
            echo "$ADDED"
            exit 1
          fi
          echo "No new synchronous I/O under lib/ui. ✔"


  golden:
    name: Widget Golden Tests
    runs-on: ubuntu-latest
    needs: [analyze, changes]
    # Skip on branch push — see the file-header note. PR + schedule still
    # run pixel goldens.
    if: needs.changes.outputs.heavy == 'true' && github.event_name != 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Widget Golden Tests
        # Pixel goldens are authored against this ubuntu image and must match
        # exactly. Any UI change that shifts a pixel will fail this job.
        # To update goldens after an intentional UI change, run on Linux:
        #   flutter test --tags golden --update-goldens
        # then commit the refreshed PNGs alongside the UI change.
        #
        # This job runs in parallel with `test` (both need `analyze` to pass)
        # so a golden failure is always reported independently of logic failures.
        # --concurrency=4 since 2026-08-07: goldens render with
        # --enable-software-rendering + --skia-deterministic-rendering, so
        # parallel load cannot change a pixel. Measured 490s -> 156s (3.1x) with
        # 3 consecutive green runs and zero diffs. See the `test` job above for
        # the full rationale and the rollback rule.
        run: flutter test --concurrency=4 --reporter expanded --tags golden
        # 20 since 2026-09-30: flutter test loads every test file to find the
        # golden-tagged ones, and ~970 files pushed the step past 10 minutes.
        timeout-minutes: 20
