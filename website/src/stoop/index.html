<!-- The Stoop hub body. Injected into the hub shell by build.mjs.
     The whole app renders into #stoop-app (see src/stoop/*.js). -->
<main class="hub">
  <header class="hub-hero">
    <h1>🏡 The Stoop</h1>
    <p>The Front Porch AI community character hub — now on your browser too. Browse, vote, share, and download character cards with the same account you use in the app.</p>
  </header>
  <noscript>
    <div class="hub-noscript">
      <p><strong>The Stoop needs JavaScript.</strong> It’s a live hub — votes and downloads update in real time — so there’s no static version. Enable JavaScript, or use The Stoop inside the
      <a href="https://frontporchai.app/#get">Front Porch AI app</a>.</p>
    </div>
  </noscript>
  <div id="stoop-app" class="hub-app">
    <div class="hub-loading"><div class="hub-lamp"></div><p>Lighting the porch…</p></div>
  </div>
</main>
