<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-label="Your words have consequences: Bond, trust, mood and needs move with every message you send">
  <title>Your words have consequences</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c1b0a"/>
      <stop offset="1" stop-color="#140c04"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#f4a259"/>
      <stop offset="1" stop-color="#e8733a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc44d" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#e8833a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffc44d" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e8733a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e8733a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff3d6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="150" rx="20"/></clipPath>
  </defs>
  <style>
    .glow { animation: pulse 4.5s ease-in-out infinite; transform-origin: 96px 75px; }
    .sheen { animation: sweep 7s ease-in-out infinite; }
    .e { fill: #ffc44d; opacity: 0; animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes pulse { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes sweep { 0% { transform: translateX(-700px); } 60%,100% { transform: translateX(1300px); } }
    @keyframes rise { 0% { opacity: 0; transform: translate(0,0); } 15% { opacity: .85; } 100% { opacity: 0; transform: translate(var(--dx), -130px); } }
    @media (prefers-reduced-motion: reduce) { .glow, .sheen, .e { animation: none; } .e { opacity: .35; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <circle class="glow" cx="96" cy="75" r="120" fill="url(#glow)"/>
    <rect class="sheen" x="0" y="0" width="420" height="150" fill="url(#sheen)"/>
    <circle class="e" cx="242" cy="142" r="1.8" style="--dx:20px;animation-duration:8.2s;animation-delay:-1.1s"/>
    <circle class="e" cx="627" cy="139" r="1.8" style="--dx:1px;animation-duration:6.5s;animation-delay:-5.0s"/>
    <circle class="e" cx="1179" cy="143" r="1.4" style="--dx:-3px;animation-duration:6.2s;animation-delay:-0.5s"/>
    <circle class="e" cx="708" cy="137" r="2.8" style="--dx:-21px;animation-duration:8.7s;animation-delay:-0.9s"/>
    <circle class="e" cx="954" cy="114" r="1.8" style="--dx:11px;animation-duration:7.8s;animation-delay:-6.1s"/>
    <circle class="e" cx="405" cy="114" r="1.8" style="--dx:-17px;animation-duration:8.6s;animation-delay:-3.1s"/>
    <circle class="e" cx="691" cy="118" r="2.2" style="--dx:12px;animation-duration:6.2s;animation-delay:-3.8s"/>
    <circle class="e" cx="706" cy="120" r="1.4" style="--dx:-14px;animation-duration:5.7s;animation-delay:-2.6s"/>
    <circle class="e" cx="889" cy="134" r="1.4" style="--dx:-22px;animation-duration:8.3s;animation-delay:-3.6s"/>
    <circle class="e" cx="299" cy="124" r="2.2" style="--dx:-10px;animation-duration:7.4s;animation-delay:-5.4s"/>
    <circle class="e" cx="195" cy="111" r="2.2" style="--dx:6px;animation-duration:5.7s;animation-delay:-0.6s"/>
    <circle class="e" cx="425" cy="117" r="2.2" style="--dx:-18px;animation-duration:6.9s;animation-delay:-7.9s"/>
    <circle class="e" cx="1016" cy="112" r="2.8" style="--dx:19px;animation-duration:9.3s;animation-delay:-6.7s"/>
    <circle class="e" cx="438" cy="117" r="1.4" style="--dx:15px;animation-duration:6.0s;animation-delay:-3.0s"/>
    <circle class="e" cx="767" cy="133" r="1.4" style="--dx:-20px;animation-duration:8.1s;animation-delay:-1.3s"/>
    <circle class="e" cx="530" cy="120" r="1.8" style="--dx:-10px;animation-duration:9.0s;animation-delay:-7.5s"/>
  </g>
  <rect x="1" y="1" width="1198" height="148" rx="19" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <rect x="50" y="29" width="92" height="92" rx="22" fill="#1b1006" stroke="url(#gold)" stroke-width="2"/>
  <g transform="translate(66 45) scale(0.94)" fill="none" stroke="url(#gold)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 54 C14 41 6 32 6 21 A12 12 0 0 1 32 15 A12 12 0 0 1 58 21 C58 32 50 41 32 54Z"/><polyline points="12,30 22,30 26,22 32,38 36,28 52,28"/>
  </g>
  <text x="176" y="72" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="44" font-weight="700" fill="url(#gold)">Your words have consequences</text>
  <text x="178" y="108" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#f3ecdd" fill-opacity="0.8">Bond, trust, mood and needs move with every message you send</text>
</svg>
