<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-label="Coming from Backyard AI?: Bring your .byaf characters home">
  <title>Coming from Backyard AI?</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c1b0a"/>
      <stop offset="1" stop-color="#140c04"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#f4a259"/>
      <stop offset="1" stop-color="#e8733a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc44d" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#e8833a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffc44d" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e8733a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e8733a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff3d6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="150" rx="20"/></clipPath>
  </defs>
  <style>
    .glow { animation: pulse 4.5s ease-in-out infinite; transform-origin: 96px 75px; }
    .sheen { animation: sweep 7s ease-in-out infinite; }
    .e { fill: #ffc44d; opacity: 0; animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes pulse { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes sweep { 0% { transform: translateX(-700px); } 60%,100% { transform: translateX(1300px); } }
    @keyframes rise { 0% { opacity: 0; transform: translate(0,0); } 15% { opacity: .85; } 100% { opacity: 0; transform: translate(var(--dx), -130px); } }
    @media (prefers-reduced-motion: reduce) { .glow, .sheen, .e { animation: none; } .e { opacity: .35; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <circle class="glow" cx="96" cy="75" r="120" fill="url(#glow)"/>
    <rect class="sheen" x="0" y="0" width="420" height="150" fill="url(#sheen)"/>
    <circle class="e" cx="920" cy="150" r="1.8" style="--dx:2px;animation-duration:6.5s;animation-delay:-1.0s"/>
    <circle class="e" cx="1023" cy="118" r="2.8" style="--dx:-14px;animation-duration:8.5s;animation-delay:-2.4s"/>
    <circle class="e" cx="1029" cy="147" r="2.8" style="--dx:2px;animation-duration:8.1s;animation-delay:-3.7s"/>
    <circle class="e" cx="542" cy="145" r="1.8" style="--dx:-10px;animation-duration:6.8s;animation-delay:-7.0s"/>
    <circle class="e" cx="776" cy="137" r="2.2" style="--dx:-16px;animation-duration:7.1s;animation-delay:-8.2s"/>
    <circle class="e" cx="537" cy="119" r="1.8" style="--dx:-11px;animation-duration:6.5s;animation-delay:-8.8s"/>
    <circle class="e" cx="959" cy="145" r="1.4" style="--dx:-14px;animation-duration:7.4s;animation-delay:-3.1s"/>
    <circle class="e" cx="863" cy="114" r="2.2" style="--dx:-21px;animation-duration:8.7s;animation-delay:-7.8s"/>
    <circle class="e" cx="1076" cy="142" r="1.4" style="--dx:4px;animation-duration:7.2s;animation-delay:-2.1s"/>
    <circle class="e" cx="1091" cy="118" r="1.4" style="--dx:-14px;animation-duration:8.1s;animation-delay:-5.9s"/>
    <circle class="e" cx="940" cy="111" r="2.8" style="--dx:10px;animation-duration:7.5s;animation-delay:-7.5s"/>
    <circle class="e" cx="888" cy="120" r="1.8" style="--dx:-16px;animation-duration:8.1s;animation-delay:-2.6s"/>
    <circle class="e" cx="507" cy="139" r="2.8" style="--dx:-10px;animation-duration:8.5s;animation-delay:-5.1s"/>
    <circle class="e" cx="1061" cy="129" r="1.4" style="--dx:-19px;animation-duration:8.8s;animation-delay:-2.8s"/>
    <circle class="e" cx="452" cy="112" r="1.8" style="--dx:-21px;animation-duration:9.4s;animation-delay:-7.5s"/>
    <circle class="e" cx="752" cy="126" r="2.2" style="--dx:-16px;animation-duration:6.3s;animation-delay:-3.8s"/>
  </g>
  <rect x="1" y="1" width="1198" height="148" rx="19" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <rect x="50" y="29" width="92" height="92" rx="22" fill="#1b1006" stroke="url(#gold)" stroke-width="2"/>
  <g transform="translate(66 45) scale(0.94)" fill="none" stroke="url(#gold)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="6" width="32" height="52" rx="2"/><circle cx="40" cy="34" r="2.5"/><path d="M48 14 L58 10 L58 58 L48 58"/><line x1="4" y1="58" x2="60" y2="58"/>
  </g>
  <text x="176" y="72" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="44" font-weight="700" fill="url(#gold)">Coming from Backyard AI?</text>
  <text x="178" y="108" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#f3ecdd" fill-opacity="0.8">Bring your .byaf characters home</text>
</svg>
